# Configuración para SonarQube / SonarCloud (escaneo de código en la nube, opcional).
# El escaneo que se ejecuta localmente es `npm run escaneo` (ver docs/evidencias/escaneo-codigo.md).
# Para usar SonarCloud: crear el proyecto en https://sonarcloud.io con la cuenta de GitHub del grupo,
# poner aquí la organización y la llave, y correr:
#   cd backend && npm run test:coverage && cd .. && npx sonar-scanner -Dsonar.token=<TOKEN>
sonar.organization=CAMBIAR-organizacion-del-grupo
sonar.projectKey=CAMBIAR_soporte-tecnico
sonar.projectName=Soporte en Aulas
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src,app/src
sonar.tests=backend/tests
sonar.exclusions=**/node_modules/**,**/coverage/**
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
